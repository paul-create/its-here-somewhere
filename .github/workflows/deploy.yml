name: Deploy Database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sql/**'
      - '.github/workflows/deploy.yml'

# Never run two database deploys at the same time
concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Test Job - Disabled until App Runner deployment is ready
  # Uncomment this section once backend is accessible via App Runner
  # ============================================================================
  # test:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #
  #     - name: Install dependencies
  #       run: npm install
  #
  #     - name: Run test suite
  #       env:
  #         BACKEND_URL: ${{ secrets.BACKEND_URL_TEST }}
  #       run: npm test

  deploy-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy database (pre-deploy, objects, post-deploy)
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh

      - name: Commit archived migrations
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sql/scripts/migration/
          git diff --cached --quiet || git commit -m "Archive migrations after deployment [skip ci]"
          git push

  # ============================================================================

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sql/**'
      - 'src/**'
      - 'db/**'
      - 'Dockerfile'
      - 'package*.json'
      - '.github/workflows/deploy.yml'

# Never run two deploys at the same time
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy database (pre-deploy, objects, post-deploy)
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh

      - name: Commit archived migrations
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sql/scripts/migration/
          git diff --cached --quiet || git commit -m "Archive migrations after deployment [skip ci]"
          git push

  build-and-push-docker:
    needs: deploy-database
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: its-here-somewhere
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: its-here-somewhere
          IMAGE_TAG: latest
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Print image URI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: its-here-somewhere
          IMAGE_TAG: latest
        run: echo "Image pushed to $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to Beanstalk with docker-compose
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: its-here-somewhere
          IMAGE_TAG: latest
        run: |
          # Create docker-compose.yml with ECR image reference
          cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            app:
              image: ${{ steps.login-ecr.outputs.registry }}/its-here-somewhere:latest
              ports:
                - "3000:3000"
              environment:
                NODE_ENV: production
                DATABASE_URL: ${{ secrets.PROD_DB }}
                S3_BUCKET: ${{ secrets.S3_BUCKET }}
                COGNITO_USER_POOL: ${{ secrets.COGNITO_USER_POOL }}
                COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
                AWS_REGION: eu-west-2
          EOF

          # Upload docker-compose.yml to S3
          aws s3 cp docker-compose.yml s3://elasticbeanstalk-eu-west-2-978841975502/docker-compose-${{ github.sha }}.yml

          # Create new application version in Beanstalk
          aws elasticbeanstalk create-application-version \
            --application-name its-here-somewhere \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=elasticbeanstalk-eu-west-2-978841975502,S3Key=docker-compose-${{ github.sha }}.yml \
            --region eu-west-2

          # Update environment to use new version
          aws elasticbeanstalk update-environment \
            --application-name its-here-somewhere \
            --environment-name its-here-somewhere-prod \
            --version-label ${{ github.sha }} \
            --region eu-west-2
name: Deploy

on:
  workflow_dispatch:  # Manual trigger only for now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Updated from 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: node tests/run-all.js
        env:
          NODE_ENV: test
      

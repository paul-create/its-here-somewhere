  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #
  #     - name: Install dependencies
  #       run: npm install
  #
  #     - name: Run test suite
  #       env:
  #         BACKEND_URL: ${{ secrets.BACKEND_URL_TEST }}
  #       run: npm test

  run-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run database migrations
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh

      - name: Commit archived migrations
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sql/scripts/migration/archive/
          git diff --cached --quiet || git commit -m "Archive migrations after successful deployment"
          git push


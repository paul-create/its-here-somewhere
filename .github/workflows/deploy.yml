name: Deploy Database Schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sql/**', '.github/workflows/deploy.yml']

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install migra psycopg2-binary

      - name: Generate migration plan
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh

      - name: Upload migration plan
        uses: actions/upload-artifact@v3
        with:
          name: migration-plan
          path: sql/scripts/migration_delta.sql
          retention-days: 7

  apply-migration:
    needs: generate-plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install psycopg2-binary

      - name: Apply migration
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: |
          echo "Applying migration to production..."
          psql "$PROD_DB" -f sql/scripts/migration_delta.sql
          echo "Migration applied successfully"
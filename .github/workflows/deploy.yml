name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install PostgreSQL client and migra
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install migra psycopg2-binary
      
      - name: Run database deployment
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh
      
      - name: Commit migration audit trail
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f sql/scripts/migration_delta.sql ]; then
            git add sql/scripts/migration_delta.sql
            git commit -m "chore: DB migration audit trail from $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

  build:
    needs: deploy-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      # ===== TESTS =====
      # Tests require a running backend (API server).
      # Local development: Run tests locally with `node tests/run-all.js`
      #   - Backend must be running on localhost:3000
      #   - Database must be accessible to backend
      # GitHub Actions: Tests are SKIPPED until App Runner is deployed

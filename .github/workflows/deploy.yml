name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - '.github/workflows/deploy.yml'

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install migra psycopg2-binary
      
      - name: Generate migration plan
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: bash sql/scripts/deploy.sh

  apply-migration:
    needs: generate-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install psycopg2-binary
      
      - name: Apply migration
        env:
          PROD_DB: ${{ secrets.PROD_DB }}
        run: |
          if [ -f sql/scripts/migration_delta.sql ] && [ -s sql/scripts/migration_delta.sql ]; then
            echo "=== Applying Migration ==="
            echo ""
            echo "SQL to be applied:"
            cat sql/scripts/migration_delta.sql
            echo ""
            echo "Running migration..."
            psql "$PROD_DB" -f sql/scripts/migration_delta.sql -q
            echo "✓ Migration applied successfully"
          else
            echo "✓ No migration needed - schema is up to date"
          fi
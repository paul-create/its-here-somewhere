name: Deploy Database Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sql/scripts/migration/manual/*.sql', 'tests/**', '.github/workflows/deploy.yml']

jobs:
  # ============================================================================
  # Test Job - Disabled until App Runner deployment is ready
  # Uncomment this section once backend is accessible via App Runner
  # ============================================================================
  # test:
  #   runs-on: ubuntu-latest
